# ============================================================
# EduTune AI - Training Configuration
# ============================================================

project:
  name: "EduTune AI"
  domain: "education"
  seed: 42

# ----------------------------------------------------------------
# Base Model
# ----------------------------------------------------------------

model:
  name: "mistralai/Mistral-7B-Instruct-v0.3"
  architecture: "MistralForCausalLM"

  quantization:
    enabled: true
    method: "4bit"
    quant_type: "nf4"
    use_double_quantization: true
    compute_dtype: "float16"

# ----------------------------------------------------------------
# Fine-Tuning Strategy
# ----------------------------------------------------------------

fine_tuning:
  method: "QLoRA"

  lora:
    enabled: true
    rank: 16
    alpha: 32
    dropout: 0.05
    bias: "none"

    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"

# ----------------------------------------------------------------
# Dataset
# ----------------------------------------------------------------

dataset:
  domain: "education"

  train_file: "data/evaluation/train.jsonl"
  validation_file: "data/evaluation/validation.jsonl"
  test_file: "data/evaluation/test.jsonl"

  input_field: "prompt"
  output_field: "response"

  max_sequence_length: 512

# ----------------------------------------------------------------
# Training
# ----------------------------------------------------------------

training:
  num_train_epochs: 3

  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1

  gradient_accumulation_steps: 8

  learning_rate: 0.0002
  weight_decay: 0.01

  warmup_ratio: 0.03

  logging_steps: 10

  eval_strategy: "steps"
  eval_steps: 50

  save_strategy: "steps"
  save_steps: 50
  save_total_limit: 2

  gradient_checkpointing: true

  optim: "paged_adamw_8bit"

  lr_scheduler_type: "cosine"

  max_grad_norm: 0.3

  fp16: false
  bf16: false

# ----------------------------------------------------------------
# Output
# ----------------------------------------------------------------

output:
  adapter_dir: "models/adapters/edutune-mistral-7b"
  checkpoint_dir: "models/checkpoints"

# ----------------------------------------------------------------
# Experiment Tracking
# ----------------------------------------------------------------

wandb:
  enabled: false
  project: "edutune-ai"
  run_name: "mistral-7b-qlora-education"
  log_model: false

# ----------------------------------------------------------------
# Evaluation
# ----------------------------------------------------------------

evaluation:
  metrics:
    - "exact_match"
    - "token_overlap"
    - "rouge"
    - "semantic_similarity"

  compare_baseline: true
  generate_benchmark_report: true

# ----------------------------------------------------------------
# Hyperparameter Search
# ----------------------------------------------------------------

hyperparameter_search:
  enabled: false

  learning_rates:
    - 0.0001
    - 0.0002

  lora_ranks:
    - 8
    - 16
    - 32

  dropout_values:
    - 0.05
    - 0.1